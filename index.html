<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ガクモン - 対戦×勉強</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f0f4f8;
      padding: 20px;
    }
    .card {
      background: white;
      max-width: 420px;
      margin: 0 auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .status-bar {
      background: #eef2f5;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
      color: #333;
      display: flex;
      justify-content: space-around;
      font-size: 14px;
    }
    .partner-box {
      background: #eccc68;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: bold;
      color: #2f3542;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .partner-box img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: white;
      object-fit: cover;
    }
    .hp-bar {
      background: #e0e0e0;
      border-radius: 8px;
      height: 16px;
      margin: 4px 0 10px 0;
      overflow: hidden;
    }
    .hp-fill-enemy {
      background: #ff4757;
      height: 100%;
      width: 100%;
      transition: width 0.3s;
    }
    .hp-fill-player {
      background: #2ed573;
      height: 100%;
      width: 100%;
      transition: width 0.3s;
    }
    .nav-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }
    .nav-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 12px;
      border: none;
      background: #dfe4ea;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .nav-btn.active {
      background: #1e90ff;
      color: white;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      background: #1e90ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:active { background: #0066cc; }
    .btn-easy { background: #2ed573; }
    .btn-medium { background: #ffa502; }
    .btn-hard { background: #ff4757; }
    .btn-dungeon { background: #8e44ad; font-weight: bold; }
    .btn-gacha { background: #9b59b6; font-size: 18px; font-weight: bold; }
    .btn-back { background: #747d8c; margin-top: 15px; }
    .btn-select { background: #ffa502; padding: 4px 8px; font-size: 11px; width: auto; margin: 2px 0; }
    .btn-lvup { background: #2ed573; padding: 4px 8px; font-size: 11px; width: auto; margin: 2px 0; }
    .btn-evolve { background: #e056fd; padding: 4px 8px; font-size: 11px; width: auto; margin: 2px 0; font-weight: bold; color: white; }
    
    .reset-btn {
      background: #95a5a6;
      font-size: 12px;
      padding: 6px;
      margin-top: 20px;
    }
    #message {
      font-weight: bold;
      margin-top: 15px;
      font-size: 15px;
    }
    .hidden { display: none; }

    /* バトルイラスト対戦エリア */
    .battle-arena {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin: 15px 0;
    }
    .fighter-box {
      width: 45%;
    }
    .fighter-img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 10px;
      background: #fff;
    }

    /* レアリティ別のオーラ（CSS効果） */
    .aura-SR {
      border: 3px solid #f39c12;
      box-shadow: 0 0 12px #f1c40f;
    }
    .aura-R {
      border: 3px solid #2980b9;
      box-shadow: 0 0 10px #3498db;
    }
    .aura-N {
      border: 3px solid #27ae60;
    }

    /* ガチャ・図鑑用スタイル */
    .gacha-result {
      background: #f1f2f6;
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
      font-size: 16px;
      font-weight: bold;
    }
    .gacha-img {
      width: 120px;
      height: 120px;
      margin-top: 10px;
      object-fit: cover;
      border-radius: 12px;
    }
    .monster-list {
      text-align: left;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 8px;
      max-height: 260px;
      overflow-y: auto;
    }
    .monster-item {
      padding: 10px 6px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .monster-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .monster-item-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .monster-thumb {
      width: 42px;
      height: 42px;
      border-radius: 6px;
      object-fit: cover;
    }
    .rarity-SR { color: #e67e22; font-weight: bold; }
    .rarity-R { color: #2980b9; font-weight: bold; }
    .rarity-N { color: #27ae60; font-weight: bold; }
    .dungeon-info {
      background: #f3e5f5;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 13px;
      color: #4a148c;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>⚔️ ガクモン ⚔️</h1>
    
    <!-- プレイヤーのステータス表示 -->
    <div class="status-bar">
      <div>🎓 所持: <span id="user-points">0</span> pt</div>
      <div>🧊 E-キューブ: <span id="user-cubes">0</span> 個</div>
    </div>

    <!-- パートナー表示 -->
    <div class="partner-box">
      <img id="partner-img" src="" alt="パートナー" class="hidden">
      <div>
        🐾 パートナー: <span id="partner-name">なし</span>
      </div>
    </div>

    <!-- メニュータブ -->
    <div class="nav-tabs">
      <button class="nav-btn active" id="tab-stage" onclick="switchTab('stage')">⚔️ ステージ</button>
      <button class="nav-btn" id="tab-dungeon" onclick="switchTab('dungeon')">🏰 ダンジョン</button>
      <button class="nav-btn" id="tab-gacha" onclick="switchTab('gacha')">🎁 ガチャ</button>
      <button class="nav-btn" id="tab-list" onclick="switchTab('list')">📜 所持</button>
    </div>

    <!-- 1. ステージ選択画面 -->
    <div id="stage-select-screen">
      <h3>挑戦するステージを選ぼう！</h3>
      <button class="btn btn-easy" onclick="startStage('easy')">🌱 初級 (たし算・ひき算) [+10pt]</button>
      <button class="btn btn-medium" onclick="startStage('medium')">🔥 中級 (かけ算・わり算) [+30pt]</button>
      <button class="btn btn-hard" onclick="startStage('hard')">👑 上級 (少しむずかしい計算) [+50pt]</button>
    </div>

    <!-- 2. ダンジョン選択画面 -->
    <div id="dungeon-select-screen" class="hidden">
      <h3>🏰 難関大学ダンジョン</h3>
      <div class="dungeon-info">
        全問正解してダンジョンを完全攻略しよう！<br>
        クリアで <b>300pt ＋ 進化素材「E-キューブ」</b> を獲得！
      </div>
      <button class="btn btn-dungeon" onclick="startDungeon('tokyo')">🎓 東京大学ダンジョン (全5問) [+300pt / 🧊1個]</button>
    </div>

    <!-- 3. バトル・クイズ画面 -->
    <div id="battle-screen" class="hidden">
      <h3 id="stage-title">ステージ</h3>
      <div id="dungeon-progress" style="font-weight:bold; color:#8e44ad; margin-bottom:5px;"></div>
      
      <!-- イラスト対戦エリア -->
      <div class="battle-arena">
        <!-- プレイヤー（左） -->
        <div class="fighter-box">
          <div style="font-size:12px; font-weight:bold;">🛡️ あなた</div>
          <img id="player-battle-img" class="fighter-img" src="" alt="自分">
          <div style="font-size:11px;">HP: <span id="player-hp-text">100</span></div>
          <div class="hp-bar"><div id="player-hp-fill" class="hp-fill-player"></div></div>
        </div>

        <div style="font-size:20px; font-weight:bold; color:#ff4757;">VS</div>

        <!-- 敵（右） -->
        <div class="fighter-box">
          <div style="font-size:12px; font-weight:bold;">👾 敵</div>
          <img id="enemy-battle-img" class="fighter-img aura-N" src="./IMG_1393.jpeg" alt="敵">
          <div style="font-size:11px;">HP: <span id="enemy-hp-text">100</span></div>
          <div class="hp-bar"><div id="enemy-hp-fill" class="hp-fill-enemy"></div></div>
        </div>
      </div>

      <hr>

      <h2 id="question">問題: </h2>
      <div id="options"></div>

      <button class="btn btn-back" onclick="showStageSelect()">あきらめて戻る</button>
    </div>

    <!-- 4. ガチャ画面 -->
    <div id="gacha-screen" class="hidden">
      <h3>ガクモンガチャ</h3>
      <p>1回 <b>100 pt</b> で引き当てよう！</p>
      <button class="btn btn-gacha" onclick="drawGacha()">🎰 ガチャを引く (100pt)</button>
      <div id="gacha-result" class="gacha-result hidden"></div>
    </div>

    <!-- 5. 所持ガクモンリスト画面 -->
    <div id="list-screen" class="hidden">
      <h3>所持ガクモン一覧</h3>
      <div id="monster-list" class="monster-list"></div>
    </div>

    <p id="message"></p>

    <!-- テスト用データリセットボタン -->
    <button class="btn reset-btn" onclick="resetData()">セーブデータを初期化</button>
  </div>

  <script>
    // プレイヤーデータ
    let userPoints = 0;
    let userCubes = 0;
    let ownedMonsters = {}; // 所持データの個別保持 { "m7": { level: 1, stage: 1 } }
    let partnerId = null;

    // レアリティ別コスト設定 (レベルアップ消費pt/Lv)
    const rarityCost = { "N": 10, "R": 20, "SR": 30 };
    // 進化段階ごとのレベル上限
    const maxLevelCap = { 1: 30, 2: 50, 3: 100 };

    // ガクモンマスターデータ（進化データ追加）
    const monsterData = {
      "m1": { id: "m1", name: "ヒコッコ", rarity: "N", stage: 1, baseHp: 100, baseAtk: 50, ability: "なし", img: "https://raw.githubusercontent.com/pokeapi/sprites/master/sprites/pokemon/1.png" },
      "m2": { id: "m2", name: "テクリン", rarity: "N", stage: 1, baseHp: 100, baseAtk: 50, ability: "なし", img: "https://raw.githubusercontent.com/pokeapi/sprites/master/sprites/pokemon/7.png" },
      "m3": { id: "m3", name: "パピラス", rarity: "N", stage: 1, baseHp: 100, baseAtk: 50, ability: "なし", img: "https://raw.githubusercontent.com/pokeapi/sprites/master/sprites/pokemon/4.png" },
      "m4": { id: "m4", name: "イグニスドラコ", rarity: "R", stage: 1, baseHp: 150, baseAtk: 60, ability: "HP・攻撃アップ", img: "https://raw.githubusercontent.com/pokeapi/sprites/master/sprites/pokemon/5.png" },
      "m5": { id: "m5", name: "ボルトロボ", rarity: "R", stage: 1, baseHp: 150, baseAtk: 60, ability: "HP・攻撃アップ", img: "https://raw.githubusercontent.com/pokeapi/sprites/master/sprites/pokemon/25.png" },
      "m6": { id: "m6", name: "ソルフェニックス", rarity: "SR", stage: 1, baseHp: 200, baseAtk: 70, ability: "会心（一定確率で2倍ダメ）", img: "https://raw.githubusercontent.com/pokeapi/sprites/master/sprites/pokemon/6.png" },
      // エンピツン（第1形態）
      "m7": { id: "m7", name: "エンピツン", rarity: "N", stage: 1, baseHp: 110, baseAtk: 55, ability: "なし", img: "./IMG_1393.jpeg", evolveTo: "m7_2", evolveReqCube: 1 },
      // シャープン（エンピツンの第2形態 / R進化）
      "m7_2": { id: "m7_2", name: "シャープン", rarity: "R", stage: 2, baseHp: 180, baseAtk: 80, ability: "なし", img: "./IMG_1394.jpeg" }
    };

    // ガチャ用ベースプールID
    const gachaPool = ["m1", "m2", "m3", "m4", "m5", "m6", "m7"];

    // バトル・ダンジョン用変数
    let currentStage = "";
    let isDungeonMode = false;
    let dungeonStep = 0;
    let dungeonTotalSteps = 5;
    let stageReward = 0;
    let enemyHP = 100;
    let enemyMaxHP = 100;
    let playerHP = 100;
    let playerMaxHP = 100;
    let playerATK = 50;
    let currentQuiz = null;

    // クイズ問題集
    const quizData = {
      easy: [
        { q: "15 + 27 = ?", options: [42, 32, 52], a: 42 },
        { q: "50 - 18 = ?", options: [32, 28, 38], a: 32 },
        { q: "8 + 9 = ?", options: [17, 16, 18], a: 17 }
      ],
      medium: [
        { q: "7 × 8 = ?", options: [56, 54, 64], a: 56 },
        { q: "72 ÷ 9 = ?", options: [8, 7, 9], a: 8 },
        { q: "12 × 4 = ?", options: [48, 44, 52], a: 48 }
      ],
      hard: [
        { q: "(12 + 8) × 3 = ?", options: [60, 50, 40], a: 60 },
        { q: "100 - 15 × 4 = ?", options: [40, 60, 30], a: 40 },
        { q: "150 ÷ 5 + 20 = ?", options: [50, 40, 60], a: 50 }
      ],
      dungeon: [
        { q: "3x + 5 = 20 のとき、x は？", options: [5, 4, 6], a: 5 },
        { q: "半径 3cm の円の面積は？ (円周率3.14)", options: [28.26, 18.84, 31.4], a: 28.26 },
        { q: "25 × 12 = ?", options: [300, 250, 350], a: 300 },
        { q: "(4 + 6) × (8 - 3) = ?", options: [50, 45, 60], a: 50 },
        { q: "1, 2, 4, 8, 16 の次に入る数は？", options: [32, 24, 64], a: 32 }
      ]
    };

    // ロード
    window.onload = function() {
      loadData();
    };

    function loadData() {
      const savedPoints = localStorage.getItem("gakumon_points");
      userPoints = savedPoints !== null ? parseInt(savedPoints, 10) : 0;

      const savedCubes = localStorage.getItem("gakumon_cubes");
      userCubes = savedCubes !== null ? parseInt(savedCubes, 10) : 0;

      const savedMonsters = localStorage.getItem("gakumon_owned_dict");
      if (savedMonsters) {
        ownedMonsters = JSON.parse(savedMonsters);
      } else {
        // 互換処理（旧配列データ）
        const oldMonsters = localStorage.getItem("gakumon_monsters");
        ownedMonsters = {};
        if (oldMonsters) {
          const list = JSON.parse(oldMonsters);
          list.forEach(id => { ownedMonsters[id] = { level: 1 }; });
        }
      }

      partnerId = localStorage.getItem("gakumon_partner");
      const keys = Object.keys(ownedMonsters);
      if (!partnerId && keys.length > 0) {
        partnerId = keys[0];
      }

      updateUI();
    }

    function saveData() {
      localStorage.setItem("gakumon_points", userPoints);
      localStorage.setItem("gakumon_cubes", userCubes);
      localStorage.setItem("gakumon_owned_dict", JSON.stringify(ownedMonsters));
      if (partnerId) localStorage.setItem("gakumon_partner", partnerId);
    }

    // ガクモンの現在の計算後ステータスを取得
    function getMonsterStats(id) {
      const m = monsterData[id];
      if (!m) return null;
      const lv = (ownedMonsters[id] && ownedMonsters[id].level) ? ownedMonsters[id].level : 1;
      const hp = m.baseHp + (lv - 1) * 10;
      const atk = m.baseAtk + (lv - 1) * 3;
      return { ...m, level: lv, hp: hp, atk: atk };
    }

    function updateUI() {
      document.getElementById("user-points").innerText = userPoints;
      document.getElementById("user-cubes").innerText = userCubes;

      // パートナー表示更新
      const partner = getMonsterStats(partnerId);
      const partnerImg = document.getElementById("partner-img");

      if (partner) {
        document.getElementById("partner-name").innerHTML = `<span class="rarity-${partner.rarity}">[${partner.rarity}] ${partner.name}</span> Lv.${partner.level} (HP:${partner.hp} / 攻:${partner.atk})`;
        partnerImg.src = partner.img;
        partnerImg.className = `monster-thumb aura-${partner.rarity}`;
      } else {
        document.getElementById("partner-name").innerText = "未セット";
        partnerImg.className = "hidden";
      }

      document.getElementById("enemy-hp-text").innerText = enemyHP;
      document.getElementById("enemy-hp-fill").style.width = Math.max(0, (enemyHP / enemyMaxHP) * 100) + "%";

      document.getElementById("player-hp-text").innerText = playerHP;
      document.getElementById("player-hp-fill").style.width = Math.max(0, (playerHP / playerMaxHP) * 100) + "%";

      renderMonsterList();
    }

    // タブ切り替え
    function switchTab(tabName) {
      document.getElementById("stage-select-screen").classList.add("hidden");
      document.getElementById("dungeon-select-screen").classList.add("hidden");
      document.getElementById("battle-screen").classList.add("hidden");
      document.getElementById("gacha-screen").classList.add("hidden");
      document.getElementById("list-screen").classList.add("hidden");

      document.getElementById("tab-stage").classList.remove("active");
      document.getElementById("tab-dungeon").classList.remove("active");
      document.getElementById("tab-gacha").classList.remove("active");
      document.getElementById("tab-list").classList.remove("active");

      document.getElementById("message").innerText = "";

      if (tabName === 'stage') {
        document.getElementById("stage-select-screen").classList.remove("hidden");
        document.getElementById("tab-stage").classList.add("active");
      } else if (tabName === 'dungeon') {
        document.getElementById("dungeon-select-screen").classList.remove("hidden");
        document.getElementById("tab-dungeon").classList.add("active");
      } else if (tabName === 'gacha') {
        document.getElementById("gacha-screen").classList.remove("hidden");
        document.getElementById("tab-gacha").classList.add("active");
      } else if (tabName === 'list') {
        document.getElementById("list-screen").classList.remove("hidden");
        document.getElementById("tab-list").classList.add("active");
      }
    }

    // パートナー変更
    function setPartner(id) {
      partnerId = id;
      saveData();
      updateUI();
      document.getElementById("message").style.color = "blue";
      document.getElementById("message").innerText = "パートナーを変更しました！";
    }

    // レベルアップ実行
    function levelUpMonster(id) {
      const stats = getMonsterStats(id);
      if (!stats) return;

      const cap = maxLevelCap[stats.stage] || 30;
      if (stats.level >= cap) {
        document.getElementById("message").style.color = "red";
        document.getElementById("message").innerText = `❌ レベル上限(Lv.${cap})に達しています！進化させると上限が解放されます。`;
        return;
      }

      const cost = rarityCost[stats.rarity] || 10;
      if (userPoints < cost) {
        document.getElementById("message").style.color = "red";
        document.getElementById("message").innerText = `❌ ポイントが足りません！(必要: ${cost}pt)`;
        return;
      }

      userPoints -= cost;
      ownedMonsters[id].level += 1;
      saveData();
      updateUI();

      document.getElementById("message").style.color = "green";
      document.getElementById("message").innerText = `✨ ${stats.name} のレベルが ${ownedMonsters[id].level} に上がった！`;
    }

    // 進化実行
    function evolveMonster(id) {
      const stats = getMonsterStats(id);
      if (!stats || !stats.evolveTo) return;

      const cap = maxLevelCap[stats.stage] || 30;
      if (stats.level < cap) {
        document.getElementById("message").style.color = "red";
        document.getElementById("message").innerText = `❌ レベルが上限(Lv.${cap})に達していないため進化できません！`;
        return;
      }

      const reqCube = stats.evolveReqCube || 1;
      if (userCubes < reqCube) {
        document.getElementById("message").style.color = "red";
        document.getElementById("message").innerText = `❌ E-キューブが足りません！(必要: ${reqCube}個)`;
        return;
      }

      const nextId = stats.evolveTo;
      const nextMaster = monsterData[nextId];

      userCubes -= reqCube;
      // 元モンスター削除、新進化先を同じレベルで追加
      delete ownedMonsters[id];
      ownedMonsters[nextId] = { level: stats.level };

      if (partnerId === id) {
        partnerId = nextId;
      }

      saveData();
      updateUI();

      document.getElementById("message").style.color = "purple";
      document.getElementById("message").innerText = `🎉 成功！ ${stats.name} は ${nextMaster.name} [${nextMaster.rarity}] に進化を遂げた！！`;
    }

    // 通常ステージ開始
    function startStage(difficulty) {
      isDungeonMode = false;
      currentStage = difficulty;
      enemyHP = 100;
      enemyMaxHP = 100;
      document.getElementById("dungeon-progress").innerText = "";
      document.getElementById("message").innerText = "";

      initBattleStatus();

      if (difficulty === 'easy') {
        stageReward = 10;
        document.getElementById("stage-title").innerText = "🌱 初級ステージ";
      } else if (difficulty === 'medium') {
        stageReward = 30;
        document.getElementById("stage-title").innerText = "🔥 中級ステージ";
      } else if (difficulty === 'hard') {
        stageReward = 50;
        enemyHP = 150;
        enemyMaxHP = 150;
        document.getElementById("stage-title").innerText = "👑 上級ステージ";
      }

      document.getElementById("stage-select-screen").classList.add("hidden");
      document.getElementById("battle-screen").classList.remove("hidden");

      nextQuestion();
      updateUI();
    }

    // ダンジョン開始
    function startDungeon(type) {
      isDungeonMode = true;
      dungeonStep = 1;
      stageReward = 300;
      enemyHP = 120;
      enemyMaxHP = 120;
      document.getElementById("message").innerText = "";

      initBattleStatus();

      document.getElementById("stage-title").innerText = "🎓 東京大学ダンジョン";
      document.getElementById("dungeon-progress").innerText = `第 ${dungeonStep} / ${dungeonTotalSteps} 階層`;

      document.getElementById("dungeon-select-screen").classList.add("hidden");
      document.getElementById("battle-screen").classList.remove("hidden");

      nextQuestion();
      updateUI();
    }

    function initBattleStatus() {
      const partner = getMonsterStats(partnerId);
      const playerImg = document.getElementById("player-battle-img");

      if (partner) {
        playerHP = partner.hp;
        playerMaxHP = partner.hp;
        playerATK = partner.atk;
        playerImg.src = partner.img;
        playerImg.className = `fighter-img aura-${partner.rarity}`;
      } else {
        playerHP = 100;
        playerMaxHP = 100;
        playerATK = 50;
        playerImg.src = "https://raw.githubusercontent.com/pokeapi/sprites/master/sprites/pokemon/0.png";
        playerImg.className = "fighter-img aura-N";
      }
    }

    // 次の問題
    function nextQuestion() {
      let questions = [];
      if (isDungeonMode) {
        questions = quizData.dungeon;
        currentQuiz = questions[(dungeonStep - 1) % questions.length];
      } else {
        questions = quizData[currentStage];
        currentQuiz = questions[Math.floor(Math.random() * questions.length)];
      }

      document.getElementById("question").innerText = "問題: " + currentQuiz.q;
      
      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";

      const shuffledOptions = [...currentQuiz.options].sort(() => Math.random() - 0.5);
      shuffledOptions.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt);
        optionsDiv.appendChild(btn);
      });
    }

    // 回答チェック
    function checkAnswer(selected) {
      const message = document.getElementById("message");
      const partner = getMonsterStats(partnerId);

      if (selected === currentQuiz.a) {
        let damage = playerATK;
        let isCritical = false;

        if (partner && partner.rarity === "SR" && Math.random() < 0.3) {
          damage *= 2;
          isCritical = true;
        }

        enemyHP -= damage;
        if (enemyHP < 0) enemyHP = 0;
        
        message.style.color = "green";
        message.innerText = isCritical 
          ? `💥 会心の一撃！ モンスターに${damage}ダメージ！` 
          : `✨ 正解！ モンスターに${damage}ダメージ！`;

        if (enemyHP === 0) {
          if (isDungeonMode) {
            if (dungeonStep >= dungeonTotalSteps) {
              userPoints += stageReward;
              userCubes += 1; // ダンジョンクリアでE-キューブ獲得！
              saveData();
              message.innerText = `🎉 ダンジョン完全クリア！ 特別報酬: ${stageReward}pt ＆ 🧊E-キューブ 1個ゲット！`;
              setTimeout(() => { showStageSelect(); }, 2500);
            } else {
              dungeonStep++;
              enemyHP = 120 + (dungeonStep * 10);
              enemyMaxHP = enemyHP;
              document.getElementById("dungeon-progress").innerText = `第 ${dungeonStep} / ${dungeonTotalSteps} 階層`;
              message.innerText = `✨ 敵を撃破！第 ${dungeonStep} 階層に進みます！`;
              nextQuestion();
            }
          } else {
            userPoints += stageReward;
            saveData();
            message.innerText = `🎉 モンスターを倒した！クリア報酬: ${stageReward}pt ゲット！`;
            setTimeout(() => { showStageSelect(); }, 2000);
          }
        } else {
          nextQuestion();
        }
      } else {
        playerHP -= 30;
        if (playerHP < 0) playerHP = 0;

        message.style.color = "red";
        message.innerText = "❌ 不正解！ 30のダメージを受けた！";

        if (playerHP === 0) {
          message.innerText = "💀 HPが0になった... 攻略失敗！";
          setTimeout(() => { showStageSelect(); }, 2000);
        } else {
          nextQuestion();
        }
      }

      updateUI();
    }

    function showStageSelect() {
      switchTab('stage');
    }

    // ガチャ実行
    function drawGacha() {
      const msg = document.getElementById("message");
      const resultDiv = document.getElementById("gacha-result");

      if (userPoints < 100) {
        msg.style.color = "red";
        msg.innerText = "❌ ポイントが足りません！(100pt必要です)";
        resultDiv.classList.add("hidden");
        return;
      }

      userPoints -= 100;

      const rand = Math.random() * 100;
      let targetRarity = "N";
      if (rand < 10) {
        targetRarity = "SR";
      } else if (rand < 40) {
        targetRarity = "R";
      }

      const pool = gachaPool.map(id => monsterData[id]).filter(m => m.rarity === targetRarity);
      const drawnMonster = pool[Math.floor(Math.random() * pool.length)];

      if (!ownedMonsters[drawnMonster.id]) {
        ownedMonsters[drawnMonster.id] = { level: 1 };
      }

      if (!partnerId) partnerId = drawnMonster.id;

      saveData();
      updateUI();

      const stats = getMonsterStats(drawnMonster.id);

      msg.innerText = "";
      resultDiv.classList.remove("hidden");
      resultDiv.innerHTML = `
        🎉 ガチャ結果 🎉<br>
        <img class="gacha-img aura-${stats.rarity}" src="${stats.img}"><br>
        <span class="rarity-${stats.rarity}">[${stats.rarity}] ${stats.name}</span> を手に入れた！
      `;
    }

    // 所持リスト描画（レベルアップ・進化ボタン配置）
    function renderMonsterList() {
      const listDiv = document.getElementById("monster-list");
      listDiv.innerHTML = "";

      const keys = Object.keys(ownedMonsters);
      if (keys.length === 0) {
        listDiv.innerHTML = "<p style='text-align:center; color:#888;'>まだガクモンを持っていません。<br>ガチャを引いて集めよう！</p>";
        return;
      }

      keys.forEach(id => {
        const stats = getMonsterStats(id);
        if (stats) {
          const item = document.createElement("div");
          item.className = "monster-item";

          const isEquipped = (partnerId === id);
          const btnText = isEquipped ? "セット中" : "パートナー";
          const btnDisabled = isEquipped ? "disabled style='opacity:0.5; cursor:default;'" : "";
          
          const cost = rarityCost[stats.rarity] || 10;
          const cap = maxLevelCap[stats.stage] || 30;

          // 進化可能か判定（進化先があり、レベルがカンストしている）
          let evolveBtnHtml = "";
          if (stats.evolveTo) {
            const reqCube = stats.evolveReqCube || 1;
            const canEvolve = (stats.level >= cap);
            const style = canEvolve ? "" : "style='opacity:0.5;'";
            evolveBtnHtml = `<button class="btn btn-evolve" ${style} onclick="evolveMonster('${id}')">🧬 進化 (🧊${reqCube})</button>`;
          }

          item.innerHTML = `
            <div class="monster-item-left">
              <img class="monster-thumb aura-${stats.rarity}" src="${stats.img}">
              <div>
                <span class="rarity-${stats.rarity}">[${stats.rarity}]</span> <b>${stats.name}</b><br>
                <small style="color:#333;"><b>Lv.${stats.level}</b> (上限:${cap})</small><br>
                <small style="color:#666;">HP:${stats.hp} / 攻:${stats.atk}</small>
              </div>
            </div>
            <div class="monster-item-actions">
              <button class="btn btn-select" ${btnDisabled} onclick="setPartner('${id}')">${btnText}</button>
              <button class="btn btn-lvup" onclick="levelUpMonster('${id}')">🆙 LvUP (${cost}pt)</button>
              ${evolveBtnHtml}
            </div>
          `;
          listDiv.appendChild(item);
        }
      });
    }

    // データリセット
    function resetData() {
      if (confirm("セーブデータを初期化しますか？")) {
        localStorage.removeItem("gakumon_points");
        localStorage.removeItem("gakumon_cubes");
        localStorage.removeItem("gakumon_monsters");
        localStorage.removeItem("gakumon_owned_dict");
        localStorage.removeItem("gakumon_partner");
        userPoints = 0;
        userCubes = 0;
        ownedMonsters = {};
        partnerId = null;
        showStageSelect();
        updateUI();
        document.getElementById("message").innerText = "データをリセットしました。";
      }
    }
  </script>

</body>
</html>
