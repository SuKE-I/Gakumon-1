<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ガクモン - 対戦×勉強</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f0f4f8;
      padding: 20px;
    }
    .card {
      background: white;
      max-width: 420px;
      margin: 0 auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .status-bar {
      background: #eef2f5;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
      color: #333;
    }
    .partner-box {
      background: #eccc68;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: bold;
      color: #2f3542;
    }
    .hp-bar {
      background: #e0e0e0;
      border-radius: 8px;
      height: 18px;
      margin: 6px 0;
      overflow: hidden;
    }
    .hp-fill-enemy {
      background: #ff4757;
      height: 100%;
      width: 100%;
      transition: width 0.3s;
    }
    .hp-fill-player {
      background: #2ed573;
      height: 100%;
      width: 100%;
      transition: width 0.3s;
    }
    .nav-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }
    .nav-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 12px;
      border: none;
      background: #dfe4ea;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .nav-btn.active {
      background: #1e90ff;
      color: white;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      background: #1e90ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:active { background: #0066cc; }
    .btn-easy { background: #2ed573; }
    .btn-medium { background: #ffa502; }
    .btn-hard { background: #ff4757; }
    .btn-dungeon { background: #8e44ad; font-weight: bold; }
    .btn-gacha { background: #9b59b6; font-size: 18px; font-weight: bold; }
    .btn-back { background: #747d8c; margin-top: 15px; }
    .btn-select { background: #ffa502; padding: 4px 8px; font-size: 12px; width: auto; display: inline-block; margin: 0; }
    
    .reset-btn {
      background: #95a5a6;
      font-size: 12px;
      padding: 6px;
      margin-top: 20px;
    }
    #message {
      font-weight: bold;
      margin-top: 15px;
      font-size: 18px;
    }
    .hidden { display: none; }

    /* ガチャ・図鑑用スタイル */
    .gacha-result {
      background: #f1f2f6;
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
      font-size: 18px;
      font-weight: bold;
    }
    .monster-list {
      text-align: left;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 8px;
      max-height: 220px;
      overflow-y: auto;
    }
    .monster-item {
      padding: 8px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .rarity-SR { color: #e67e22; font-weight: bold; }
    .rarity-R { color: #2980b9; font-weight: bold; }
    .rarity-N { color: #27ae60; font-weight: bold; }
    .dungeon-info {
      background: #f3e5f5;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      color: #4a148c;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>⚔️ ガクモン ⚔️</h1>
    
    <!-- プレイヤーのステータス表示 -->
    <div class="status-bar">
      🎓 所持ポイント: <span id="user-points">0</span> pt
    </div>

    <!-- パートナー表示 -->
    <div class="partner-box">
      🐾 パートナー: <span id="partner-name">なし</span>
    </div>

    <!-- メニュータブ -->
    <div class="nav-tabs">
      <button class="nav-btn active" id="tab-stage" onclick="switchTab('stage')">⚔️ ステージ</button>
      <button class="nav-btn" id="tab-dungeon" onclick="switchTab('dungeon')">🏰 ダンジョン</button>
      <button class="nav-btn" id="tab-gacha" onclick="switchTab('gacha')">🎁 ガチャ</button>
      <button class="nav-btn" id="tab-list" onclick="switchTab('list')">📜 所持</button>
    </div>

    <!-- 1. ステージ選択画面 -->
    <div id="stage-select-screen">
      <h3>挑戦するステージを選ぼう！</h3>
      <button class="btn btn-easy" onclick="startStage('easy')">🌱 初級 (たし算・ひき算) [+10pt]</button>
      <button class="btn btn-medium" onclick="startStage('medium')">🔥 中級 (かけ算・わり算) [+30pt]</button>
      <button class="btn btn-hard" onclick="startStage('hard')">👑 上級 (少しむずかしい計算) [+50pt]</button>
    </div>

    <!-- 2. ダンジョン選択画面 -->
    <div id="dungeon-select-screen" class="hidden">
      <h3>🏰 難関大学ダンジョン</h3>
      <div class="dungeon-info">
        全問正解してダンジョンを完全攻略しよう！<br>途中で倒れると報酬は手に入りません。
      </div>
      <button class="btn btn-dungeon" onclick="startDungeon('tokyo')">🎓 東京大学ダンジョン (全5問) [+300pt]</button>
    </div>

    <!-- 3. バトル・クイズ画面 -->
    <div id="battle-screen" class="hidden">
      <h3 id="stage-title">ステージ</h3>
      <div id="dungeon-progress" style="font-weight:bold; color:#8e44ad; margin-bottom:5px;"></div>
      
      <!-- 敵HP -->
      <div style="font-size:14px; text-align:left;">👾 敵モンスター (HP: <span id="enemy-hp-text">100</span>)</div>
      <div class="hp-bar">
        <div id="enemy-hp-fill" class="hp-fill-enemy"></div>
      </div>

      <!-- プレイヤーHP -->
      <div style="font-size:14px; text-align:left; margin-top:8px;">🛡️ 自分のHP (HP: <span id="player-hp-text">100</span>)</div>
      <div class="hp-bar">
        <div id="player-hp-fill" class="hp-fill-player"></div>
      </div>

      <hr>

      <h2 id="question">問題: </h2>
      <div id="options"></div>

      <button class="btn btn-back" onclick="showStageSelect()">あきらめて戻る</button>
    </div>

    <!-- 4. ガチャ画面 -->
    <div id="gacha-screen" class="hidden">
      <h3>ガクモンガチャ</h3>
      <p>1回 <b>100 pt</b> で引き当てよう！</p>
      <button class="btn btn-gacha" onclick="drawGacha()">🎰 ガチャを引く (100pt)</button>
      <div id="gacha-result" class="gacha-result hidden"></div>
    </div>

    <!-- 5. 所持ガクモンリスト画面 -->
    <div id="list-screen" class="hidden">
      <h3>所持ガクモン一覧</h3>
      <div id="monster-list" class="monster-list"></div>
    </div>

    <p id="message"></p>

    <!-- テスト用データリセットボタン -->
    <button class="btn reset-btn" onclick="resetData()">セーブデータを初期化</button>
  </div>

  <script>
    // プレイヤーデータ
    let userPoints = 0;
    let ownedMonsters = []; // 所持ガクモンIDのリスト
    let partnerId = null;   // セット中のガクモンID

    // ガクモンマスターデータ
    const monsterData = [
      { id: "m1", name: "ヒコッコ", rarity: "N", type: "数学", hp: 100, atk: 50, ability: "なし" },
      { id: "m2", name: "テクリン", rarity: "N", type: "計算", hp: 100, atk: 50, ability: "なし" },
      { id: "m3", name: "パピラス", rarity: "N", type: "国語", hp: 100, atk: 50, ability: "なし" },
      { id: "m4", name: "イグニスドラコ", rarity: "R", type: "理科", hp: 150, atk: 60, ability: "HP・攻撃アップ" },
      { id: "m5", name: "ボルトロボ", rarity: "R", type: "工学", hp: 150, atk: 60, ability: "HP・攻撃アップ" },
      { id: "m6", name: "ソルフェニックス", rarity: "SR", type: "総合", hp: 200, atk: 70, ability: "会心（一定確率で2倍ダメ）" }
    ];

    // バトル・ダンジョン用変数
    let currentStage = "";
    let isDungeonMode = false;
    let dungeonStep = 0;
    let dungeonTotalSteps = 5;
    let stageReward = 0;
    let enemyHP = 100;
    let enemyMaxHP = 100;
    let playerHP = 100;
    let playerMaxHP = 100;
    let playerATK = 50;
    let currentQuiz = null;

    // クイズ問題集
    const quizData = {
      easy: [
        { q: "15 + 27 = ?", options: [42, 32, 52], a: 42 },
        { q: "50 - 18 = ?", options: [32, 28, 38], a: 32 },
        { q: "8 + 9 = ?", options: [17, 16, 18], a: 17 }
      ],
      medium: [
        { q: "7 × 8 = ?", options: [56, 54, 64], a: 56 },
        { q: "72 ÷ 9 = ?", options: [8, 7, 9], a: 8 },
        { q: "12 × 4 = ?", options: [48, 44, 52], a: 48 }
      ],
      hard: [
        { q: "(12 + 8) × 3 = ?", options: [60, 50, 40], a: 60 },
        { q: "100 - 15 × 4 = ?", options: [40, 60, 30], a: 40 },
        { q: "150 ÷ 5 + 20 = ?", options: [50, 40, 60], a: 50 }
      ],
      dungeon: [
        { q: "3x + 5 = 20 のとき、x は？", options: [5, 4, 6], a: 5 },
        { q: "半径 3cm の円の面積は？ (円周率3.14)", options: [28.26, 18.84, 31.4], a: 28.26 },
        { q: "25 × 12 = ?", options: [300, 250, 350], a: 300 },
        { q: "(4 + 6) × (8 - 3) = ?", options: [50, 45, 60], a: 50 },
        { q: "1, 2, 4, 8, 16 の次に入る数は？", options: [32, 24, 64], a: 32 }
      ]
    };

    // ロード
    window.onload = function() {
      loadData();
    };

    function loadData() {
      const savedPoints = localStorage.getItem("gakumon_points");
      userPoints = savedPoints !== null ? parseInt(savedPoints, 10) : 0;

      const savedMonsters = localStorage.getItem("gakumon_monsters");
      ownedMonsters = savedMonsters !== null ? JSON.parse(savedMonsters) : [];

      partnerId = localStorage.getItem("gakumon_partner");

      if (!partnerId && ownedMonsters.length > 0) {
        partnerId = ownedMonsters[0];
      }

      updateUI();
    }

    function saveData() {
      localStorage.setItem("gakumon_points", userPoints);
      localStorage.setItem("gakumon_monsters", JSON.stringify(ownedMonsters));
      if (partnerId) localStorage.setItem("gakumon_partner", partnerId);
    }

    function updateUI() {
      document.getElementById("user-points").innerText = userPoints;

      const partner = monsterData.find(m => m.id === partnerId);
      if (partner) {
        document.getElementById("partner-name").innerHTML = `<span class="rarity-${partner.rarity}">[${partner.rarity}] ${partner.name}</span> (HP:${partner.hp} / 攻:${partner.atk})`;
      } else {
        document.getElementById("partner-name").innerText = "未セット";
      }

      document.getElementById("enemy-hp-text").innerText = enemyHP;
      document.getElementById("enemy-hp-fill").style.width = Math.max(0, (enemyHP / enemyMaxHP) * 100) + "%";

      document.getElementById("player-hp-text").innerText = playerHP;
      document.getElementById("player-hp-fill").style.width = Math.max(0, (playerHP / playerMaxHP) * 100) + "%";

      renderMonsterList();
    }

    // タブ切り替え
    function switchTab(tabName) {
      document.getElementById("stage-select-screen").classList.add("hidden");
      document.getElementById("dungeon-select-screen").classList.add("hidden");
      document.getElementById("battle-screen").classList.add("hidden");
      document.getElementById("gacha-screen").classList.add("hidden");
      document.getElementById("list-screen").classList.add("hidden");

      document.getElementById("tab-stage").classList.remove("active");
      document.getElementById("tab-dungeon").classList.remove("active");
      document.getElementById("tab-gacha").classList.remove("active");
      document.getElementById("tab-list").classList.remove("active");

      document.getElementById("message").innerText = "";

      if (tabName === 'stage') {
        document.getElementById("stage-select-screen").classList.remove("hidden");
        document.getElementById("tab-stage").classList.add("active");
      } else if (tabName === 'dungeon') {
        document.getElementById("dungeon-select-screen").classList.remove("hidden");
        document.getElementById("tab-dungeon").classList.add("active");
      } else if (tabName === 'gacha') {
        document.getElementById("gacha-screen").classList.remove("hidden");
        document.getElementById("tab-gacha").classList.add("active");
      } else if (tabName === 'list') {
        document.getElementById("list-screen").classList.remove("hidden");
        document.getElementById("tab-list").classList.add("active");
      }
    }

    // パートナー変更
    function setPartner(id) {
      partnerId = id;
      saveData();
      updateUI();
      document.getElementById("message").style.color = "blue";
      document.getElementById("message").innerText = "パートナーを変更しました！";
    }

    // 通常ステージ開始
    function startStage(difficulty) {
      isDungeonMode = false;
      currentStage = difficulty;
      enemyHP = 100;
      enemyMaxHP = 100;
      document.getElementById("dungeon-progress").innerText = "";
      document.getElementById("message").innerText = "";

      initBattleStatus();

      if (difficulty === 'easy') {
        stageReward = 10;
        document.getElementById("stage-title").innerText = "🌱 初級ステージ";
      } else if (difficulty === 'medium') {
        stageReward = 30;
        document.getElementById("stage-title").innerText = "🔥 中級ステージ";
      } else if (difficulty === 'hard') {
        stageReward = 50;
        enemyHP = 150;
        enemyMaxHP = 150;
        document.getElementById("stage-title").innerText = "👑 上級ステージ";
      }

      document.getElementById("stage-select-screen").classList.add("hidden");
      document.getElementById("battle-screen").classList.remove("hidden");

      nextQuestion();
      updateUI();
    }

    // ダンジョン開始
    function startDungeon(type) {
      isDungeonMode = true;
      dungeonStep = 1;
      stageReward = 300;
      enemyHP = 120;
      enemyMaxHP = 120;
      document.getElementById("message").innerText = "";

      initBattleStatus();

      document.getElementById("stage-title").innerText = "🎓 東京大学ダンジョン";
      document.getElementById("dungeon-progress").innerText = `第 ${dungeonStep} / ${dungeonTotalSteps} 階層`;

      document.getElementById("dungeon-select-screen").classList.add("hidden");
      document.getElementById("battle-screen").classList.remove("hidden");

      nextQuestion();
      updateUI();
    }

    function initBattleStatus() {
      const partner = monsterData.find(m => m.id === partnerId);
      if (partner) {
        playerHP = partner.hp;
        playerMaxHP = partner.hp;
        playerATK = partner.atk;
      } else {
        playerHP = 100;
        playerMaxHP = 100;
        playerATK = 50;
      }
    }

    // 次の問題
    function nextQuestion() {
      let questions = [];
      if (isDungeonMode) {
        questions = quizData.dungeon;
        currentQuiz = questions[(dungeonStep - 1) % questions.length];
      } else {
        questions = quizData[currentStage];
        currentQuiz = questions[Math.floor(Math.random() * questions.length)];
      }

      document.getElementById("question").innerText = "問題: " + currentQuiz.q;
      
      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";

      const shuffledOptions = [...currentQuiz.options].sort(() => Math.random() - 0.5);
      shuffledOptions.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt);
        optionsDiv.appendChild(btn);
      });
    }

    // 回答チェック
    function checkAnswer(selected) {
      const message = document.getElementById("message");
      const partner = monsterData.find(m => m.id === partnerId);

      if (selected === currentQuiz.a) {
        let damage = playerATK;
        let isCritical = false;

        if (partner && partner.rarity === "SR" && Math.random() < 0.3) {
          damage *= 2;
          isCritical = true;
        }

        enemyHP -= damage;
        if (enemyHP < 0) enemyHP = 0;
        
        message.style.color = "green";
        message.innerText = isCritical 
          ? `💥 会心の一撃！ モンスターに${damage}ダメージ！` 
          : `✨ 正解！ モンスターに${damage}ダメージ！`;

        if (enemyHP === 0) {
          if (isDungeonMode) {
            if (dungeonStep >= dungeonTotalSteps) {
              // ダンジョン全クリア！
              userPoints += stageReward;
              saveData();
              message.innerText = `🎉 ダンジョン完全クリア！ 特別報酬: ${stageReward}pt ゲット！`;
              setTimeout(() => { showStageSelect(); }, 2500);
            } else {
              // 次の階層へ
              dungeonStep++;
              enemyHP = 120 + (dungeonStep * 10);
              enemyMaxHP = enemyHP;
              document.getElementById("dungeon-progress").innerText = `第 ${dungeonStep} / ${dungeonTotalSteps} 階層`;
              message.innerText = `✨ 敵を撃破！第 ${dungeonStep} 階層に進みます！`;
              nextQuestion();
            }
          } else {
            // 通常ステージクリア
            userPoints += stageReward;
            saveData();
            message.innerText = `🎉 モンスターを倒した！クリア報酬: ${stageReward}pt ゲット！`;
            setTimeout(() => { showStageSelect(); }, 2000);
          }
        } else {
          nextQuestion();
        }
      } else {
        // 不正解
        playerHP -= 30;
        if (playerHP < 0) playerHP = 0;

        message.style.color = "red";
        message.innerText = "❌ 不正解！ 30のダメージを受けた！";

        if (playerHP === 0) {
          message.innerText = "💀 HPが0になった... 攻略失敗！";
          setTimeout(() => { showStageSelect(); }, 2000);
        } else {
          nextQuestion();
        }
      }

      updateUI();
    }

    function showStageSelect() {
      switchTab('stage');
    }

    // ガチャ実行
    function drawGacha() {
      const msg = document.getElementById("message");
      const resultDiv = document.getElementById("gacha-result");

      if (userPoints < 100) {
        msg.style.color = "red";
        msg.innerText = "❌ ポイントが足りません！(100pt必要です)";
        resultDiv.classList.add("hidden");
        return;
      }

      userPoints -= 100;

      const rand = Math.random() * 100;
      let targetRarity = "N";
      if (rand < 10) {
        targetRarity = "SR";
      } else if (rand < 40) {
        targetRarity = "R";
      }

      const pool = monsterData.filter(m => m.rarity === targetRarity);
      const drawnMonster = pool[Math.floor(Math.random() * pool.length)];

      if (!ownedMonsters.includes(drawnMonster.id)) {
        ownedMonsters.push(drawnMonster.id);
      }

      if (!partnerId) partnerId = drawnMonster.id;

      saveData();
      updateUI();

      msg.innerText = "";
      resultDiv.classList.remove("hidden");
      resultDiv.innerHTML = `🎉 ガチャ結果 🎉<br><span class="rarity-${drawnMonster.rarity}">[${drawnMonster.rarity}] ${drawnMonster.name}</span> を手に入れた！`;
    }

    // 所持リスト描画
    function renderMonsterList() {
      const listDiv = document.getElementById("monster-list");
      listDiv.innerHTML = "";

      if (ownedMonsters.length === 0) {
        listDiv.innerHTML = "<p style='text-align:center; color:#888;'>まだガクモンを持っていません。<br>ガチャを引いて集めよう！</p>";
        return;
      }

      ownedMonsters.forEach(id => {
        const monster = monsterData.find(m => m.id === id);
        if (monster) {
          const item = document.createElement("div");
          item.className = "monster-item";

          const isEquipped = (partnerId === monster.id);
          const btnText = isEquipped ? "セット中" : "パートナーにする";
          const btnDisabled = isEquipped ? "disabled style='opacity:0.5; cursor:default;'" : "";

          item.innerHTML = `
            <div>
              <span class="rarity-${monster.rarity}">[${monster.rarity}]</span> <b>${monster.name}</b><br>
              <small style="color:#666;">HP:${monster.hp} / 攻:${monster.atk} (${monster.ability})</small>
            </div>
            <button class="btn btn-select" ${btnDisabled} onclick="setPartner('${monster.id}')">${btnText}</button>
          `;
          listDiv.appendChild(item);
        }
      });
    }

    // データリセット
    function resetData() {
      if (confirm("セーブデータを初期化しますか？")) {
        localStorage.removeItem("gakumon_points");
        localStorage.removeItem("gakumon_monsters");
        localStorage.removeItem("gakumon_partner");
        userPoints = 0;
        ownedMonsters = [];
        partnerId = null;
        showStageSelect();
        updateUI();
        document.getElementById("message").innerText = "データをリセットしました。";
      }
    }
  </script>

</body>
</html>
